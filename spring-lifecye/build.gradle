plugins {
    id 'java'
}

group 'com.bp'
version '1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework:spring-web'
    implementation group: 'mysql', name: 'mysql-connector-java', version: '5.1.45'
    // testCompile "junit:junit:4.12"
    testImplementation 'org.springframework:spring-test'
}
